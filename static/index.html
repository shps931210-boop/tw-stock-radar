<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>股栗子</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* 股栗子：奶油底、栗子棕主色、柔和紅綠（台股慣例紅漲綠跌），圓角、低對比裝飾，不走科技風 */
:root {
  --bg: #f8f3ec; --panel: #fffdf9; --line: #eadfd0; --ink: #3d2b1f; --muted: #7d6a5a; --faint: #a99787;
  --accent: #8b5a34; --accent-2: #a46a3d; --accent-soft: #f4e7d7; --hero: #7a4e2e; --hero-ink: #fff8ef; --hero-muted: #ecd6bd;
  --up: #c4524a; --down: #4f8c5f; --warn: #b07b2c; --chip: #f2e9dd;
  --up-bg: #f9e7e3; --down-bg: #e5f1e6; --warn-bg: #f8eedb;
  --gold: #d1a03a; --silver: #a59c94; --bronze: #b5774a;
  --ma5: #d6a23c; --ma20: #6f8fb3; --ma60: #a4789f; --ma120: #6aa598; --ma240: #b08a6b;
  --f-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-num: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1f1915; --panel: #29211b; --line: #3d3229; --ink: #f2e8dc; --muted: #c0ad99; --faint: #8f7e6e;
  --accent: #dcae80; --accent-2: #e6bd93; --accent-soft: #3a2d22; --hero: #4a3424; --hero-ink: #fbf2e6; --hero-muted: #dcc4a8;
  --up: #e8857b; --down: #7dbb8c; --warn: #e0b060; --chip: #342a22;
  --up-bg: #43271f; --down-bg: #233628; --warn-bg: #3c2f1b;
  --gold: #e6bb5c; --silver: #bdb3a9; --bronze: #d29a6c;
  --ma5: #e6bd60; --ma20: #93b1d3; --ma60: #c79ac1; --ma120: #8cc5b7; --ma240: #cfab8b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #1f1915; --panel: #29211b; --line: #3d3229; --ink: #f2e8dc; --muted: #c0ad99; --faint: #8f7e6e;
  --accent: #dcae80; --accent-2: #e6bd93; --accent-soft: #3a2d22; --hero: #4a3424; --hero-ink: #fbf2e6; --hero-muted: #dcc4a8;
  --up: #e8857b; --down: #7dbb8c; --warn: #e0b060; --chip: #342a22;
  --up-bg: #43271f; --down-bg: #233628; --warn-bg: #3c2f1b;
  --gold: #e6bb5c; --silver: #bdb3a9; --bronze: #d29a6c;
  --ma5: #e6bd60; --ma20: #93b1d3; --ma60: #c79ac1; --ma120: #8cc5b7; --ma240: #cfab8b; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 var(--f-body); }
a { color: var(--accent-2); text-decoration: none; } a:hover { text-decoration: underline; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12px; }
.up { color: var(--up); } .down { color: var(--down); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
input[type=text], input[type=number], input[type=search], select { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }

/* 頂部 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
.brand { color: var(--ink); display: flex; align-items: center; gap: 10px; }
.brand:hover { text-decoration: none; }
.brand svg { flex: none; }
.brand b { display: block; font: 700 20px/1.1 var(--f-display); letter-spacing: .08em; color: var(--accent); }
.brand small { display: block; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
nav { display: flex; gap: 2px; flex-wrap: wrap; }
nav a { padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 500; }
nav a.on { background: var(--accent-soft); color: var(--accent); }
nav a:hover { text-decoration: none; color: var(--ink); }
nav .cnt { font-size: 11px; background: var(--chip); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
.search { margin-left: auto; } .search input { width: 210px; background: var(--bg); }
.fresh { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 6px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
.fresh b { color: var(--ink); font-weight: 500; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 999px; padding: 7px 18px; font-weight: 500; cursor: pointer; }
.btn:hover { text-decoration: none; filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.sm { padding: 3px 10px; font-size: 12px; }
.btn.lg { padding: 11px 26px; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { border: 0; background: none; cursor: pointer; color: var(--faint); padding: 2px 6px; font-size: 16px; line-height: 1; }
.icon-btn:hover { color: var(--ink); }
.star { color: var(--faint); } .star.on { color: var(--gold); }

main { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
h1 { font: 700 28px/1.3 var(--f-display); margin: 0; text-wrap: balance; }
h2 { font: 700 18px/1.4 var(--f-display); margin: 0; text-wrap: balance; }
h3 { font-size: 14px; margin: 0; }
.lead { color: var(--muted); max-width: 68ch; margin: 6px 0 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 12px; }
.banner { border-left: 3px solid var(--warn); background: var(--warn-bg); padding: 9px 12px; font-size: 13px; border-radius: 0 6px 6px 0; }
.banner.info { border-color: var(--accent-2); background: var(--accent-soft); }
.banner.bad { border-color: var(--down); background: var(--down-bg); }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.good { background: var(--up-bg); color: var(--up); font-weight: 500; }
.pill.bad { background: var(--down-bg); color: var(--down); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.side { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 980px) { .side { grid-template-columns: minmax(0, 1fr); } }
.empty { padding: 32px; text-align: center; color: var(--muted); }

/* 首頁 */
.hero { display: grid; gap: 18px; }
.entries { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.entry { border-radius: 14px; padding: 24px; display: grid; gap: 14px; align-content: start; border: 1px solid var(--line); background: var(--panel); }
.entry.ai { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.entry.ai .muted { color: var(--hero-muted); }
.entry h2 { font-size: 22px; }
.entry ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 6px 14px; font-size: 13px; }
.entry li { display: flex; gap: 6px; } .entry li::before { content: "✓"; color: var(--gold); font-weight: 700; }
.entry:not(.ai) li::before { color: var(--accent-2); }
.entry .btn { justify-self: start; }
.entry.ai .btn { background: var(--hero-ink); color: var(--hero); border-color: var(--hero-ink); }
.who { font-size: 12px; padding: 2px 10px; border-radius: 999px; justify-self: start; background: var(--accent-soft); color: var(--accent); }
.entry.ai .who { background: rgba(255,255,255,.12); color: var(--hero-ink); }
.mkt { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; }
@media (max-width: 860px) { .mkt { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.kpi span { display: block; font-size: 12px; color: var(--muted); }
.kpi b { font: 500 20px var(--f-num); white-space: nowrap; }
.kpi b span { display: inline; }
.fresh.demo { background: var(--up); color: #fff; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding-block: 10px; }
.fresh.demo span { color: #fff; opacity: .92; }
.fresh.bad { background: var(--up); color: #fff; padding-block: 10px; }
.fresh.bad b, .fresh.bad span { color: #fff; }
.fresh.warn { background: var(--warn-bg); }
.fresh.warn > b { color: var(--warn); }
.errs { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--muted); }
.errbox summary { cursor: pointer; color: var(--warn); }
.fresh.demo b { color: #fff; font-weight: 700; font-size: 14px; }
.breadth { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--chip); margin: 6px 0 2px; }
.breadth i { display: block; }
.ind { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font-size: 13px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.flow span { padding: 6px 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.flow span.k { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 500; }
.flow em { color: var(--faint); font-style: normal; }

/* 表格 */
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th[data-sort] { cursor: pointer; } th[data-sort]:hover { color: var(--ink); }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
td.wrap { white-space: normal; min-width: 200px; }
.r { text-align: right; }
tr.link { cursor: pointer; } tr.link:hover td { background: var(--chip); }
.bar { display: inline-block; width: 56px; height: 6px; background: var(--chip); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent-2); }
.medal { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; font: 700 12px var(--f-num); background: var(--chip); color: var(--muted); }
.medal.m1 { background: var(--gold); color: #fff; } .medal.m2 { background: var(--silver); color: #fff; } .medal.m3 { background: var(--bronze); color: #fff; }

/* AI 頁 */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.mode { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 14px 16px; cursor: pointer; display: grid; gap: 4px; }
.mode.on { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
.mode b { font-size: 16px; } .mode span { font-size: 12px; color: var(--muted); }
.wbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin-top: 6px; }
.wbar i { display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--muted); margin-top: 4px; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 6px 16px; margin: 0; padding: 0; list-style: none; }
.steps li { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--faint); }
.steps li::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); flex: none; }
.steps li.done { color: var(--ink); } .steps li.done::before { background: var(--accent-2); border-color: var(--accent-2); }
.go { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
.reason { font-size: 12px; color: var(--muted); }

/* 條件建構器 */
.crow { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(90px, .6fr) minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.crow select, .crow input { width: 100%; }
.crow .val { display: flex; gap: 6px; align-items: center; } .crow .val span { font-size: 12px; color: var(--muted); white-space: nowrap; }
@media (max-width: 640px) { .crow { grid-template-columns: 1fr 1fr; } }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-size: 13px; cursor: pointer; color: var(--muted); }
.seg button.on { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.list { display: grid; gap: 4px; }
.li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px; font-size: 13px; }
.li:hover { background: var(--chip); }
.li .acts { display: flex; gap: 2px; flex: none; }
.analysis { display: grid; gap: 12px; }
.analysis h3 { font-size: 13px; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
.analysis ul { margin: 4px 0 0; padding-left: 18px; }

/* 個股頁 */
.s-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-end; }
.s-head .px { font: 500 32px var(--f-num); line-height: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.stat { background: var(--bg); border-radius: 7px; padding: 8px 10px; }
.stat span { display: block; font-size: 11px; color: var(--muted); }
.stat b { font: 500 15px var(--f-num); }
.chk { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }
.chk i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; }
.chart { width: 100%; height: 380px; } .chart.sm { height: 220px; } .chart.xs { height: 180px; }
.aibox { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.aibox ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.msc { display: flex; gap: 8px; flex-wrap: wrap; }
.msc div { background: var(--bg); border-radius: 7px; padding: 6px 12px; } .msc span { font-size: 11px; color: var(--muted); display: block; } .msc b { font: 500 17px var(--f-num); }
details.strat { border-top: 1px solid var(--line); padding: 7px 0; }
details.strat summary { cursor: pointer; display: flex; gap: 8px; align-items: center; list-style: none; font-size: 13px; }
details.strat summary::-webkit-details-marker { display: none; }
.ck { display: grid; grid-template-columns: 18px 1fr auto; gap: 4px 8px; font-size: 13px; padding: 2px 0 2px 4px; }
.ok { color: var(--up); } .no { color: var(--faint); }
.news { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.news li { font-size: 13px; display: grid; grid-template-columns: auto 1fr; gap: 8px; }
/* 直觀化元件 */
.bigsearch { display: flex; gap: 8px; max-width: 640px; }
.bigsearch .btn { white-space: nowrap; }
.bigsearch input { flex: 1; min-width: 0; width: 100%; font-size: 16px; padding: 12px 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--panel); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.tile { display: grid; gap: 6px; align-content: start; padding: 18px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.tile:hover { text-decoration: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-soft); }
.tile .q { font-size: 13px; color: var(--muted); }
.tile b { font: 700 18px var(--f-display); }
.tile .n { font: 500 30px/1 var(--f-num); }
.tile .n small { font: 400 13px var(--f-body); color: var(--muted); margin-left: 4px; }
.tile.hot { background: var(--hero); color: var(--hero-ink); border-color: var(--hero); }
.tile.hot .q, .tile.hot .n small { color: var(--hero-muted); }
.scan { display: grid; gap: 4px; }
.entry.ai h2 { color: var(--hero-ink); }
.scan .li { padding: 8px 10px; cursor: pointer; }
.scan .li b { font-weight: 500; }
.meta-row { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.meta-row b { color: var(--ink); font-weight: 500; }
.tiles.sm .tile { padding: 14px 16px; } .tiles.sm .tile b { font-size: 15px; } .tiles.sm .tile .n { font-size: 22px; }
.bd { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px 24px; align-items: center; }
@media (max-width: 640px) { .bd { grid-template-columns: minmax(0, 1fr); } }
.bd .total { text-align: center; } .bd .total b { font: 500 46px/1 var(--f-num); display: block; } .bd .total span { font-size: 12px; color: var(--muted); }
.frow { display: grid; grid-template-columns: 76px minmax(0, 1fr) 36px 118px; gap: 10px; align-items: center; font-size: 13px; padding: 4px 0; }
.frow .track { position: relative; height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.frow .track i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; }
.frow .track em { position: absolute; left: 50%; top: -2px; bottom: -2px; border-left: 1.5px dashed var(--faint); }
.frow .c { font-size: 11px; color: var(--muted); text-align: right; white-space: nowrap; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); gap: 12px; }
.scard2 { display: grid; gap: 8px; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.scard2:hover { border-color: var(--accent-2); }
.scard2 .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.scard2 .px { font: 500 18px var(--f-num); }
.scard2 p { margin: 0; font-size: 13px; color: var(--muted); }
.trg { display: flex; flex-wrap: wrap; gap: 4px; }
.st-buy { background: var(--up); color: #fff; font-weight: 700; }
.st-watch { background: var(--warn-bg); color: var(--warn); font-weight: 500; }
.st-none { background: var(--chip); color: var(--muted); }
.verdict { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); font-size: 15px; }
.verdict.buy { background: var(--up-bg); }
.radar text { fill: var(--muted); font: 12px var(--f-body); }
.radar .grid { fill: none; stroke: var(--line); }
.radar .area { fill: var(--accent-2); fill-opacity: .22; stroke: var(--accent-2); stroke-width: 2; }
.radar .avg { fill: none; stroke: var(--faint); stroke-dasharray: 4 3; }
.grid-s { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.scard { display: grid; gap: 6px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
.scard:hover { border-color: var(--accent-2); text-decoration: none; }
.scard .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.scard .cnt { font: 500 22px var(--f-num); }
.scard p { margin: 0; font-size: 13px; color: var(--muted); }
.three { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.three h3 { font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: .04em; margin-bottom: 4px; }
.three p { margin: 0; }
footer { max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 0 32px; font-size: 12px; color: var(--muted); }
@media (max-width: 640px) { .search { margin-left: 0; width: 100%; } .search input { width: 100%; } .chart { height: 300px; } h1 { font-size: 24px; } }

<body>
<header class="top">
  <div class="top-in">

      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><path d="M18 5c6 0 12 6.5 12 14.5C30 26 24.6 31 18 31S6 26 6 19.5C6 11.5 12 5 18 5z" fill="var(--accent)"/><path d="M8.2 22.5c3 2.6 6.3 3.6 9.8 3.6s6.8-1 9.8-3.6C29 27.6 24 31 18 31S7 27.6 8.2 22.5z" fill="var(--hero-muted)" opacity=".9"/><path d="M18 5c-.6-1.6-.4-2.6.3-3.2" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" fill="none"/><ellipse cx="13.5" cy="13" rx="2.6" ry="1.6" fill="#fff" opacity=".35" transform="rotate(-30 13.5 13)"/></svg>
      <span><b>股栗子</b><small>簡單看懂台股好公司</small></span></a>
    <nav id="nav">
      <a href="#/" data-r="">首頁</a>
      <a href="#/buy" data-r="buy">今日技術訊號</a>

    <div class="search"><input id="q" type="search" list="stockList" placeholder="搜尋代號或名稱，如 2330" autocomplete="off" aria-label="搜尋股票"><datalist id="stockList"></datalist></div>
  </div>

<main id="app"><div class="empty">載入中…</div></main>
<footer><a href="#/catalog">指標資料庫</a>：所有指標的公式、資料來源與限制。<br>本網站依公開資料與事先定義的規則篩選與評分。「AI 解讀」由數據規則自動產生，不是預測。所有門檻與權重皆為示範參數、尚未經台股歷史回測驗證；分數是相對排名，不是上漲機率，也不構成投資建議。</footer>
<script>
const STATIC = window.STATIC_DATA || null;
const SITE = !!window.STATIC_SITE;  // build_site.py 產生的靜態網站：讀 data/*.json，沒有後端
let SNAP = null, BYID = {}, CAT = {}, charts = [], priceChart = null;
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get(k, d) { try { const v = localStorage.getItem("yx_" + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem("yx_" + k, JSON.stringify(v)); } catch (e) {} } };
const FC = { quality: "#8b5a34", growth: "#c4524a", value: "#5f9a8c", momentum: "#d1a03a", trend: "#8f7aa8" };
const FL = { quality: "財務品質", growth: "成長能力", value: "估值", momentum: "股價動能", trend: "趨勢" };

// ---------- 格式 ----------
const PRICE_LIKE = new Set(["close", "ma5", "ma10", "ma20", "ma60", "ma120", "ma240", "eps_ttm", "high_52w", "low_52w", "stop_ref", "div_cash_last"]);
function fmtNum(v, d = 2) { return v == null || isNaN(v) ? "—" : Number(v).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d }); }
function money(v) { if (v == null) return "—"; const a = Math.abs(v); return a >= 1e8 ? fmtNum(v / 1e8, a >= 1e10 ? 0 : 1) + " 億" : a >= 1e4 ? fmtNum(v / 1e4, 0) + " 萬" : fmtNum(v, 0); }
const unitOf = (k) => (CAT[k] || {}).unit || "";
const isBig = (k) => unitOf(k) === "元" && !PRICE_LIKE.has(k);
function fmt(key, v) {
  if (v == null) return "—";
  if (typeof v === "boolean") return v ? "是" : "否";
  const u = unitOf(key);
  if (u === "%" || u === "百分點") return fmtNum(v, 1) + (u === "%" ? "%" : " pt");
  if (u === "元") return isBig(key) ? money(v) : fmtNum(v, 2);
  if (u === "倍") return fmtNum(v, 2);
  if (u === "張") return (v > 0 ? "+" : "") + fmtNum(v, 0);
  if (["分", "百分位", "日", "年"].includes(u)) return fmtNum(v, 0);
  return fmtNum(v, 2);
}
const signCls = (v) => v > 0 ? "up" : v < 0 ? "down" : "";
const pctTxt = (v) => v == null ? "—" : `${v > 0 ? "+" : ""}${fmtNum(v, 2)}%`;
const XN = { base_ok: "基本門檻", coverage: "因子資料完整度", complete: "資料完整", data_completeness: "資料完整度", vol_1y_pct: "波動率百分位", is_financial: "金融業" };
const nm = (k) => (CAT[k] || {}).name || XN[k] || k;

// ---------- 條件（與後端相同規則） ----------
function check(c, r) {
  if (c.skip_financial && r.is_financial) return "na";
  const a = r[c.m];
  if (a == null) return null;
  if (c.op === "is") return Boolean(a) === c.v;
  if (c.op === ">m" || c.op === "<m") { const b = r[c.v]; return b == null ? null : c.op === ">m" ? a > b : a < b; }
  if (c.op === "between") return a > c.v[0] && a < c.v[1];
  return { ">": a > c.v, ">=": a >= c.v, "<": a < c.v, "<=": a <= c.v }[c.op];
}
const OPS = { ">": ">", ">=": "≥", "<": "<", "<=": "≤", "between": "介於", "is": "是／否", ">m": "> 指標", "<m": "< 指標" };
function condLabel(c) {
  if (c.label) return c.label;
  if (c.op === "is") return `${nm(c.m)}：${c.v ? "是" : "否"}`;
  if (c.op === ">m" || c.op === "<m") return `${nm(c.m)} ${c.op[0]} ${nm(c.v)}`;
  if (c.op === "between") return `${nm(c.m)} 介於 ${fmt(c.m, c.v[0])} ~ ${fmt(c.m, c.v[1])}`;
  return `${nm(c.m)} ${OPS[c.op]} ${fmt(c.m, c.v)}`;
}
const mark = (x) => x === true ? '<span class="ok">✓</span>' : x === "na" ? '<span class="faint" title="不適用">–</span>' : x === null ? '<span class="faint" title="資料不足">?</span>' : '<span class="no">✗</span>';
const resTxt = (x) => x === true ? '<span class="ok">符合</span>' : x === "na" ? '<span class="faint">不適用</span>' : x === null ? '<span class="faint">資料不足</span>' : '<span class="no">不符合</span>';

// ---------- 資料 ----------
async function loadSnap() {
  if (STATIC) SNAP = STATIC.snapshot;
  else {
    const r = await fetch(SITE ? "data/snapshot.json" : "/api/snapshot" + (DEMO ? "?demo=1" : ""));
    if (!r.ok && SITE) { renderNoData(await fetch("data/status.json").then((x) => x.json()).catch(() => ({ detail: "還沒有成功取得真實行情。" }))); return false; }
    if (!r.ok) { renderNoData(await r.json().catch(() => ({ detail: "無法連到網站後端" }))); return false; }
    SNAP = await r.json();
  }
  BYID = Object.fromEntries(SNAP.stocks.map((s) => [s.stock_id, s]));
  CAT = Object.fromEntries(SNAP.catalog.map((c) => [c.key, c]));
  $("#stockList").innerHTML = SNAP.stocks.filter((s) => s.is_common).map((s) => `<option value="${s.stock_id} ${esc(s.name)}">`).join("");
  renderFresh(); renderWcnt();
  return true;
}
const DEMO = new URLSearchParams(location.search).get("demo") === "1";
// 沒有真實資料時：只顯示失敗原因，不顯示任何股價或選股結果
function renderNoData(e) {
  $("#fresh").classList.add("bad");
  $("#fresh").innerHTML = `<b>⚠ 資料取得失敗</b><span>目前沒有真實行情，因此不顯示任何股價與選股結果。</span>`;
  $("#app").innerHTML = `<section class="card" style="display:grid;gap:12px;max-width:760px">
    <h2>還沒有成功取得真實資料</h2><p>${esc(e.detail || "")}</p>
    ${e.last_attempt ? `<p class="faint">最後一次嘗試：<span class="num">${esc(e.last_attempt.replace("T", " "))}</span></p>` : ""}
    ${(e.errors || []).length ? `<div><b>錯誤紀錄</b><ul class="errs">${e.errors.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${SITE ? "" : `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="upd">立即更新資料</button><span id="job"></span>
    <a class="btn ghost" href="?demo=1">改看示範畫面（模擬資料）</a></div>`}</section>`;
  if ($("#upd")) $("#upd").onclick = startUpdate;
}
async function loadStock(id) {
  if (STATIC) return STATIC.details[id];
  const r = await fetch(SITE ? `data/stock/${id}.json` : `/api/stock/${id}` + (DEMO ? "?demo=1" : ""));
  return r.ok ? r.json() : null;
}
function renderFresh(job) {
  const d = SNAP.data_dates;
  if (SNAP.source === "demo") {
    $("#fresh").classList.add("demo");
    $("#fresh").innerHTML = `<b>⚠ 目前是模擬資料</b><span>股價、財報、分數都是程式產生的假數字，用來展示畫面，與今天實際行情無關，請勿參考。接上證交所與 FinMind 後會自動換成真實資料。</span>`;
    return;
  }
  const late = SNAP.expected_date && d.prices && d.prices < SNAP.expected_date;
  const bad = (SNAP.health || []).filter((h) => !h.last_ok || h.last_ok < (d.prices || ""));
  const errs = (SNAP.meta?.last_errors || "").split("\n").filter(Boolean);
  $("#fresh").classList.toggle("warn", !!(late || errs.length));
  const h = SNAP.history, running = SNAP.meta?.update_state === "running";
  const histMsg = h && !h.ready ? `<b>⏳ 歷史股價${running ? "回補中" : "不足"}：目前 ${h.days} 個交易日，需要 ${h.need} 天。收盤價是真實的，但技術指標與選股排行要等回補完成才會出現。</b>` : "";
  if (histMsg) $("#fresh").classList.add("warn");
  if (SNAP.rankings_blocked) $("#fresh").classList.add("warn");
  $("#fresh").innerHTML = `${SNAP.rankings_blocked ? `<b>⛔ ${esc(SNAP.rankings_blocked)}。</b>` : ""}${histMsg}${late ? (SNAP.expected_basis === "official"
      ? `<b>⚠ 行情不是最新：證交所已公布 ${SNAP.expected_date} 的行情，網站資料只到 ${d.prices}</b>`
      : `<b>⚠ 行情可能不是最新：最新資料日 ${d.prices}，推估應為 ${SNAP.expected_date}（無法連到證交所確認；若當天休市則正常）</b>`) : ""}
    ${(() => { const q = Object.fromEntries((SNAP.health || []).map((h) => [h.source, h.last_ok])); return q.twse_quotes !== undefined
      ? `<span>上市股價 <b class="num">${q.twse_quotes || "從未成功"}</b></span><span>上櫃股價 <b class="num">${q.tpex_quotes || "從未成功"}</b></span>`
      : `<span>行情 <b class="num">${d.prices || "—"}</b></span>`; })()}
    ${SNAP.history && !SNAP.history.ready ? "" : SNAP.history ? `<span>歷史股價 <b class="num">${SNAP.history.days}</b> 天</span>` : ""}<span>月營收 <b class="num">${d.revenue || "—"}</b></span><span>財報 <b class="num">${d.financials || "—"}</b></span>
    <span>分析於 <span class="num">${(SNAP.generated_at || "").replace("T", " ")}</span></span>
    ${bad.length ? `<span title="${esc(bad.map((h) => h.label + "：最後成功 " + (h.last_ok || "從未")).join("\n"))}">未更新：${bad.map((h) => esc(h.label)).join("、")}</span>` : ""}
    ${errs.length ? `<details class="errbox"><summary>上次更新有 ${errs.length} 個警告</summary><ul class="errs">${errs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></details>` : ""}
    ${STATIC || SITE ? "" : `<span id="job">${job || ""}</span><button class="btn sm ghost" id="upd">立即更新資料</button>`}`;
  const b = $("#upd"); if (b) b.onclick = startUpdate;
}
async function startUpdate() {
  const tok = store.get("admin_token", "");
  let r = await fetch("/api/update", { method: "POST", headers: tok ? { "X-Admin-Token": tok } : {} });
  if (r.status === 403 && location.hostname !== "127.0.0.1" && location.hostname !== "localhost") {
    const t = prompt("請輸入管理員密碼（ADMIN_TOKEN）"); if (!t) return;
    store.set("admin_token", t);
    r = await fetch("/api/update", { method: "POST", headers: { "X-Admin-Token": t } });
  }
  if (!r.ok && r.status !== 409) { $("#job").textContent = (await r.json().catch(() => ({}))).detail || `更新失敗（HTTP ${r.status}）`; return; }
  const t = setInterval(async () => {
    const s = await (await fetch("/api/status")).json();
    if (s.running) { $("#job").textContent = `更新中：${s.stage} ${s.total ? s.done + "/" + s.total : ""}`; $("#upd").disabled = true; }
    else { clearInterval(t); if (await loadSnap()) { renderFresh(s.errors?.length ? `完成，${s.errors.length} 個警告` : "已更新"); route(); } }
  }, 1500);
}

// ---------- 觀察清單 ----------
const watch = () => store.get("watch", {});
function toggleWatch(id) {
  const w = watch();
  if (w[id]) delete w[id]; else w[id] = { added: SNAP.data_dates.prices, price: BYID[id]?.close };
  store.set("watch", w); renderWcnt();
}
function renderWcnt() { $("#wcnt").textContent = Object.keys(watch()).length; }
const starBtn = (id) => `<button class="icon-btn star ${watch()[id] ? "on" : ""}" data-star="${id}" title="加入／移出觀察清單" aria-label="觀察清單">${watch()[id] ? "★" : "☆"}</button>`;
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-star]");
  if (!b) return;
  e.stopPropagation(); toggleWatch(b.dataset.star);
  const on = !!watch()[b.dataset.star];
  $$(`[data-star="${b.dataset.star}"]`).forEach((x) => { x.classList.toggle("on", on); x.textContent = on ? "★" : "☆"; });
}, true);

// ---------- 直觀化元件 ----------
const STL = { buy: "出現技術訊號", watch: "觀察中", none: "無訊號" };
const stPill = (s) => `<span class="pill st-${s.timing?.status || "none"}">${STL[s.timing?.status || "none"]}</span>`;
function spark(arr, w = 96, h = 28) {
  if (!arr || arr.length < 2) return "";
  const mn = Math.min(...arr), mx = Math.max(...arr), sx = w / (arr.length - 1), sy = (h - 4) / ((mx - mn) || 1);
  const pts = arr.map((v, i) => `${(i * sx).toFixed(1)},${(h - 2 - (v - mn) * sy).toFixed(1)}`).join(" ");
  const col = arr[arr.length - 1] >= arr[0] ? "var(--up)" : "var(--down)";
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
const RAX = [["quality", "品質"], ["growth", "成長"], ["value", "估值"], ["momentum", "動能"], ["trend", "趨勢"], ["chips", "籌碼"]];
function radar(s, size = 260) {
  const c = size / 2, R = c - 42, n = RAX.length, ang = (i) => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [c + Math.cos(ang(i)) * R * v / 100, c + Math.sin(ang(i)) * R * v / 100];
  const poly = (vals) => vals.map((v, i) => pt(i, v).map((x) => x.toFixed(1)).join(",")).join(" ");
  const grid = [25, 50, 75, 100].map((g) => `<polygon class="grid" points="${poly(RAX.map(() => g))}"/>`).join("");
  const axes = RAX.map((_, i) => { const [x, y] = pt(i, 100); return `<line class="grid" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`; }).join("");
  const labels = RAX.map(([k, l], i) => { const [x, y] = pt(i, 128); const v = s["score_" + k]; return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle">${l} ${v == null ? "—" : Math.round(v)}</text>`; }).join("");
  return `<svg class="radar" width="100%" viewBox="0 0 ${size} ${size}" style="max-width:${size}px" role="img" aria-label="六面向評分雷達圖">${grid}${axes}
    <polygon class="avg" points="${poly(RAX.map(() => 50))}"/><polygon class="area" points="${poly(RAX.map(([k]) => s["score_" + k] ?? 0))}"/>${labels}</svg>`;
}
function stockCard(s) {
  const t = s.timing || {};
  return `<div class="scard2" data-id="${s.stock_id}" tabindex="0">
    <div class="row"><span>${starBtn(s.stock_id)}<b class="num">${s.stock_id}</b> ${esc(s.name)} <span class="faint small">${esc(s.industry || "")}</span></span>${stPill(s)}</div>
    <div class="row"><span><span class="px">${fmtNum(s.close)}</span> <span class="num ${signCls(s.chg_pct)}">${pctTxt(s.chg_pct)}</span></span>${spark(s.spark)}</div>
    ${t.triggers?.length ? `<div class="trg">${t.triggers.map((k) => `<span class="pill good">${esc(SNAP.triggers[k])}</span>`).join("")}</div>` : ""}
    <p>${esc(s.ai.summary)}</p>
    <div class="row"><span class="pill acc">${esc(s.ai.tag)}</span><span class="small muted">AI 分數 <b class="num" style="color:var(--ink)">${s.ai.modes.balanced.score == null ? "—" : fmtNum(s.ai.modes.balanced.score, 1)}</b></span></div></div>`;
}
function bindCards(root) { $$(".scard2", root).forEach((c) => { c.onclick = (e) => { if (!e.target.closest("button,a")) location.hash = `#/stock/${c.dataset.id}`; }; c.onkeydown = (e) => { if (e.key === "Enter") c.click(); }; }); }

// ---------- 共用元件 ----------
function scoreBar(v) { return `<span class="num">${v == null ? "—" : fmtNum(v, 1)}</span><span class="bar"><i style="width:${v || 0}%"></i></span>`; }
function stockCell(s) { return `${starBtn(s.stock_id)}<a href="#/stock/${s.stock_id}"><b class="num">${s.stock_id}</b> ${esc(s.name)}</a> <span class="faint small">${esc(s.industry || "")}</span>`; }
function stockTable(rows, cols) {
  if (!rows.length) return `<div class="empty">沒有符合條件的股票</div>`;
  return `<div class="tbl"><table><thead><tr><th>#</th><th>股票</th><th>技術訊號</th><th class="r">收盤</th><th class="r">漲跌</th><th>近 3 月</th>
    ${cols.map((k) => `<th class="r" data-sort="${k}" title="${esc((CAT[k] || {}).formula || "")}">${esc(nm(k))}</th>`).join("")}
    <th class="r" data-sort="__ai">AI 均衡分數</th><th>AI 評估</th></tr></thead><tbody>
    ${rows.map((s, i) => `<tr class="link" data-id="${s.stock_id}"><td class="num faint">${i + 1}</td><td>${stockCell(s)}</td><td>${stPill(s)}</td>
      <td class="r num">${fmtNum(s.close)}</td><td class="r num ${signCls(s.chg_pct)}">${pctTxt(s.chg_pct)}</td><td>${spark(s.spark, 80, 24)}</td>
      ${cols.map((k) => `<td class="r num">${fmt(k, s[k])}</td>`).join("")}
      <td class="r">${scoreBar(s.ai.modes.balanced.score)}</td><td><span class="pill acc">${esc(s.ai.tag)}</span></td></tr>`).join("")}</tbody></table></div>`;
}
function bindRows(root, rows, rerender) {
  $$("tr.link", root).forEach((tr) => tr.onclick = (e) => { if (!e.target.closest("a,button")) location.hash = `#/stock/${tr.dataset.id}`; });
  let asc = false, key = null;
  $$("th[data-sort]", root).forEach((th) => th.onclick = () => {
    const k = th.dataset.sort; asc = key === k ? !asc : false; key = k;
    const val = (s) => k === "__ai" ? s.ai.modes.balanced.score : s[k];
    rows.sort((a, b) => ((val(a) ?? -Infinity) - (val(b) ?? -Infinity)) * (asc ? 1 : -1)); rerender();
  });
}
function mkChart(el, opt = {}) {
  const c = LightweightCharts.createChart(el, Object.assign({
    autoSize: true, layout: { background: { color: "transparent" }, textColor: css("--muted"), fontFamily: "Noto Sans TC, PingFang TC, sans-serif", fontSize: 11 },
    grid: { vertLines: { visible: false }, horzLines: { color: css("--line") } },
    rightPriceScale: { borderVisible: false }, timeScale: { borderVisible: false }, crosshair: { mode: 0 }, localization: { locale: "zh-TW" } }, opt));
  charts.push(c); return c;
}
const hasLWC = () => !!window.LightweightCharts;
function weightBar(w) {
  const ks = Object.keys(w).sort((a, b) => w[b] - w[a]);

// ---------- 個股 AI 分數拆解 ----------
function breakdown(s, md) {
  const m = SNAP.ai_modes[md], w = m.weights, sc = s.ai.modes[md], tw = Object.values(w).reduce((a, b) => a + b, 0);
  const ks = Object.keys(w).sort((a, b) => w[b] - w[a]);
  const has = ks.filter((k) => s["score_" + k] != null);
  const contrib = (k) => s["score_" + k] * w[k] / tw;
  const best = [...has].sort((a, b) => contrib(b) - contrib(a))[0], worst = [...has].sort((a, b) => s["score_" + a] - s["score_" + b])[0];
  const rows = ks.map((k) => { const v = s["score_" + k]; return `<div class="frow"><span>${FL[k]}</span>
      <span class="track"><i style="width:${v ?? 0}%;background:${FC[k]}"></i><em></em></span><b class="num r">${v == null ? "—" : fmtNum(v, 0)}</b>
      <span class="c">權重 ${Math.round(w[k] * 100)}%${v == null ? "" : `・貢獻 ${fmtNum(contrib(k), 1)}`}</span></div>`; }).join("");
  const why = sc.score == null ? (s.missing_detail?.length ? `資料不足，暫不排名：${s.missing_detail.map(esc).join("；")}` : "未通過基本門檻，不計算分數。")
    : `加分最多的是「${FL[best]}」（貢獻 ${fmtNum(contrib(best), 1)} 分）${worst !== best && s["score_" + worst] < 50 ? `；拖累最多的是「${FL[worst]}」，只有 ${fmtNum(s["score_" + worst], 0)} 分，低於全市場中位數` : ""}。`;
  return `<div class="bd"><div class="total"><b>${sc.score == null ? "—" : fmtNum(sc.score, 1)}</b><span>/ 100・${esc(m.name)}</span><br>
      <span>${sc.rank ? `第 ${sc.rank} 名` : SNAP.rankings_blocked ? "暫停排名" : "未入榜"}</span></div><div>${rows}</div></div>
    <p style="margin:12px 0 0;font-size:14px">${why}</p>
    <p class="faint small" style="margin:6px 0 0">每個因子是和 ${SNAP.universe.base_ok} 檔通過基本門檻的上市櫃普通股比較的百分位（虛線 = 中位數 50），總分 = 各因子分數 × 權重。
      計算於 ${(SNAP.generated_at || "").slice(0, 16).replace("T", " ")}，股價資料日 ${s.date}，資料完整度 ${s.data_completeness ?? "—"}%，模型 ${esc(SNAP.model?.version || "")}。</p>`;
}

}

    $("#cmp").scrollIntoView({ behavior: "smooth" });
  };
  $("#sname").oninput = (e) => { draft.name = e.target.value; store.set("draft", draft); };
  $("#logic").onclick = (e) => { const b = e.target.closest("button"); if (b) { draft.logic = b.dataset.l; draw(); results(); } };
  $("#conds").onchange = (e) => {
    const i = +e.target.dataset.i, f = e.target.dataset.f, c = draft.conds[i]; if (!c) return;
    const sc = isBig(c.m) ? 1e4 : 1;
    if (f === "m") { c.m = e.target.value; c.op = isBoolM(c.m) ? "is" : ">"; c.v = isBoolM(c.m) ? true : 0; normalize(c); draw(); return; }
    if (f === "op") { c.op = e.target.value; normalize(c); draw(); return; }
    if (f === "v") c.v = isBoolM(c.m) ? e.target.value === "true" : (c.op === ">m" || c.op === "<m") ? e.target.value : +e.target.value * sc;
    if (f === "v0") c.v[0] = +e.target.value * sc;
    if (f === "v1") c.v[1] = +e.target.value * sc;
    store.set("draft", draft);
  };
  $("#conds").onclick = (e) => { const b = e.target.closest("[data-del]"); if (b) { draft.conds.splice(+b.dataset.del, 1); draw(); } };
  $("#add").onclick = () => { draft.conds.push({ m: "roe", op: ">", v: 15 }); draw(); };
  $("#clear").onclick = () => { draft = { name: "新策略", logic: "AND", conds: [] }; draw(); results(); };
  $("#go").onclick = () => { results(); $("#rt").scrollIntoView({ behavior: "smooth", block: "nearest" }); };
  const doSave = (asNew) => {
    const list = saved(), now = new Date().toISOString().slice(0, 10);
    const item = { name: draft.name || "未命名策略", logic: draft.logic, conds: JSON.parse(JSON.stringify(draft.conds)), updated: now };
    const i = asNew ? -1 : list.findIndex((s) => s.name === item.name);
    if (asNew && list.some((s) => s.name === item.name)) item.name += "（副本）";
    if (i >= 0) list[i] = item; else list.push(item);
    store.set("strategies", list); draft.name = item.name; draw(); drawSide();
  };
  $("#save").onclick = () => doSave(false);
  $("#saveas").onclick = () => doSave(true);
  $("aside").onclick = (e) => {
    const t = e.target.closest("[data-load],[data-copy],[data-rm],[data-tpl]"); if (!t) return;
    const list = saved();
    if (t.dataset.load) { const s = list[+t.dataset.load]; draft = { name: s.name, logic: s.logic, conds: JSON.parse(JSON.stringify(s.conds)) }; draw(); results(); }
    if (t.dataset.copy) { const s = list[+t.dataset.copy]; list.push({ ...JSON.parse(JSON.stringify(s)), name: s.name + "（副本）" }); store.set("strategies", list); drawSide(); }
    if (t.dataset.rm) { list.splice(+t.dataset.rm, 1); store.set("strategies", list); drawSide(); }
    if (t.dataset.tpl) { const s = SNAP.strategies.find((x) => x.id === t.dataset.tpl);
      draft = { name: s.name, logic: "AND", conds: [{ m: "base_ok", op: "is", v: true }].concat(s.conditions.map(stripLabel)), template: { name: s.name, concept: s.concept, evidence: s.evidence, risks: s.risks } }; draw(); results(); }
  };
  $("#ask").onclick = () => { const rows = results(); $("#ana").innerHTML = analyze(draft, rows); };
  draw(); drawSide(); results();
}

// ---------- 系統分析篩選結果（依規則自動產生） ----------
const STYLE = { quality: ["roe", "roa", "gross_margin", "op_margin", "debt_ratio", "ocf_ttm", "fcf_ttm", "ocf_to_ni", "roe_years_15", "earnings_cv", "equity_multiplier", "fscore", "ni_ttm", "score_quality"],
  growth: ["rev_yoy", "rev_yoy_prev", "rev_yoy_3m", "rev_ytd_yoy", "rev_accel", "eps_q_yoy", "op_q_yoy", "gm_q_change", "score_growth"],
  value: ["per", "pbr", "dy", "earnings_yield", "book_to_price", "fcf_yield", "per_pctile_1y", "magic_rank", "score_value"],
  momentum: ["mom_12_1", "rs_rank", "ret_1m", "ret_3m", "ret_6m", "ret_12m", "score_momentum"],
  trend: ["close", "ma5", "ma20", "ma60", "ma120", "ma240", "ma60_slope_20", "ma_bull", "dist_ma60", "brk_20", "brk_60", "brk_120", "brk_252", "vol_ratio", "bb_break", "rsi", "k", "macd_hist", "score_trend"],
  chips: ["foreign_5d", "trust_5d", "foreign_streak", "trust_streak", "inst_20d", "inst_ratio_5d", "margin_chg_20d", "price_up_margin_down"],
  dividend: ["div_years", "payout", "div_growth_3y"], risk: ["vol_1y", "vol_1y_pct", "downside_vol", "beta", "mdd_1y", "disposition", "long_term_loss", "base_ok"],
  liquidity: ["avg_value_20", "history_days", "base_ok"] };
const STYLE_NAME = { quality: "品質型", growth: "成長型", value: "價值型", momentum: "動能型", trend: "趨勢／技術型", chips: "籌碼型", dividend: "配息型", risk: "風險控制", liquidity: "流動性控制" };
function analyze(d, rows) {
  const used = d.conds.map((c) => c.m), total = SNAP.stocks.filter((s) => s.is_common);
  const groups = Object.keys(STYLE).filter((g) => used.some((m) => STYLE[g].includes(m) || (g === "trend" && (d.conds.find((c) => c.m === m)?.op || "").endsWith("m"))));
  const styles = groups.filter((g) => !["risk", "liquidity"].includes(g)).map((g) => STYLE_NAME[g]);
  const avg = (rs, k) => { const v = rs.map((s) => s[k]).filter((x) => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const uncovered = [];
  if (!groups.includes("liquidity")) uncovered.push("沒有限制成交金額，可能選到流動性差、不易買賣的股票（建議加入「20 日平均成交金額」或「通過基本門檻」）。");
  if (!groups.includes("value")) uncovered.push("沒有估值條件，可能選到股價已經很貴的公司。");
  if (!used.some((m) => ["eps_ttm", "ni_ttm", "roe", "roa", "op_income_q", "long_term_loss", "base_ok"].includes(m))) uncovered.push("沒有獲利條件，可能選到虧損公司。");
  if (!groups.includes("trend") && !groups.includes("momentum")) uncovered.push("沒有價格趨勢條件，可能選到股價仍在下跌的股票。");
  if (!groups.includes("risk") || (groups.includes("risk") && !used.some((m) => ["vol_1y", "vol_1y_pct", "beta", "mdd_1y", "downside_vol"].includes(m)))) uncovered.push("沒有波動度條件（年化波動率、Beta、最大回撤），無法控制價格風險。");
  if (!used.includes("base_ok") && !used.includes("disposition")) uncovered.push("沒有排除處置股票與長期虧損股。");
  const strict = [];
  const pass = d.conds.map((c) => ({ c, n: total.filter((s) => { const r = check(c, s); return r === true || r === "na"; }).length }));
  const share = rows.length / (total.length || 1);
  if (!rows.length) strict.push("目前沒有任何股票符合，條件過度嚴格。");
  else if (rows.length < 5 && d.logic === "AND") strict.push(`只有 ${rows.length} 檔符合，條件偏嚴格，結果容易受單一公司影響。`);
  else if (share > 0.3) strict.push(`有 ${(share * 100).toFixed(0)}% 的股票符合，條件偏寬鬆，篩選效果有限。`);
  else strict.push(`${rows.length} 檔符合（約全市場 ${(share * 100).toFixed(1)}%），嚴格程度適中。`);
  const tight = pass.slice().sort((a, b) => a.n - b.n)[0];
  if (tight && d.logic === "AND") strict.push(`最嚴格的條件是「${condLabel(tight.c)}」，單獨只有 ${tight.n} 檔符合。`);
  const ind = {}; rows.forEach((s) => ind[s.industry || "未分類"] = (ind[s.industry || "未分類"] || 0) + 1);
  const inds = Object.entries(ind).sort((a, b) => b[1] - a[1]);
  const conc = inds.length && rows.length >= 3 && inds[0][1] / rows.length >= 0.4;
  const fs = ["quality", "growth", "value", "momentum", "trend"].map((f) => [f, avg(rows, "score_" + f), avg(total.filter((s) => s.base_ok), "score_" + f)]);
  const lean = fs.filter(([, a, b]) => a != null && b != null && a - b > 10).map(([f]) => FL[f]);
  return `<div class="analysis card" style="background:var(--bg);border-color:transparent;margin-bottom:14px">
    <div class="card-h" style="margin:0"><h2>系統分析</h2><span class="faint small">依你的條件與結果自動產生，不是預測</span></div>
    <div><h3>投資風格</h3><p style="margin:2px 0">${styles.length ? `這套條件偏向 <b>${styles.join("＋")}</b>` : "條件主要是風險與流動性控制，沒有明顯的選股風格"}${lean.length ? `；結果在 <b>${lean.join("、")}</b> 的平均分數明顯高於全市場。` : "。"}</p></div>
    ${rows.length ? `<div><h3>可能選到的公司</h3><p style="margin:2px 0">平均 ROE ${fmt("roe", avg(rows, "roe"))}、月營收年增 ${fmt("rev_yoy", avg(rows, "rev_yoy"))}、本益比 ${fmt("per", avg(rows, "per"))} 倍、近 6 個月報酬 ${fmt("ret_6m", avg(rows, "ret_6m"))}。
      主要產業：${inds.slice(0, 3).map(([k, v]) => `${esc(k)} ${v} 檔`).join("、")}。</p></div>` : ""}
    <div><h3>條件嚴格程度</h3><ul>${strict.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>
    ${conc ? `<div><h3>產業集中</h3><p style="margin:2px 0" class="down">結果有 ${(inds[0][1] / rows.length * 100).toFixed(0)}% 集中在 ${esc(inds[0][0])}，容易受單一產業循環影響。</p></div>` : ""}
    <div><h3>尚未涵蓋的風險</h3>${uncovered.length ? `<ul>${uncovered.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : '<p style="margin:2px 0">主要風險面向都有涵蓋。</p>'}</div>
  </div>`;
}

const tone = (t) => { const p = POS.filter((w) => t.includes(w)).length, n = NEG.filter((w) => t.includes(w)).length; return p > n ? 1 : n > p ? -1 : 0; };
function maSeries(px, n) { const out = []; let sum = 0; for (let i = 0; i < px.length; i++) { sum += px[i].close; if (i >= n) sum -= px[i - n].close; if (i >= n - 1) out.push({ time: px[i].date, value: sum / n }); } return out; }

    <section class="card"><div class="toolbar" style="margin-bottom:8px">
        <div class="seg" id="rng">${["1M", "3M", "6M", "1Y", "2Y"].map((r) => `<button data-r="${r}" class="${r === store.get("rng", "6M") ? "on" : ""}">${r}</button>`).join("")}</div>
        <div class="seg" id="typ"><button data-t="candle" class="${store.get("typ", "candle") === "candle" ? "on" : ""}">K 線</button><button data-t="line" class="${store.get("typ", "candle") === "line" ? "on" : ""}">折線</button></div>
        ${[5, 20, 60, 120, 240].map((n) => `<label class="chk"><input type="checkbox" data-ma="${n}" ${store.get("ma", [20, 60]).includes(n) ? "checked" : ""}><i style="background:var(--ma${n})"></i>MA${n}</label>`).join("")}
      </div><div class="chart" id="pc"></div></section>
    <section class="stats">${stats.map(([k, l]) => `<div class="stat"><span>${l}</span><b>${fmt(k, s[k])}</b></div>`).join("")}</section>
    <section class="card"><div class="toolbar" style="justify-content:space-between;margin-bottom:6px"><span></span><div class="seg" id="specSeg">${Object.entries(M).map(([k, m]) => `<button data-m="${k}" class="${k === mode ? "on" : ""}">${esc(m.name)}</button>`).join("")}</div></div><div id="spec"></div></section>
    <section class="two">
      <div class="card"><div class="card-h"><h2>月營收</h2><span class="muted small">柱：營收（億）・線：年增率 %</span></div><div class="chart sm" id="rc"></div></div>
      <div class="card"><div class="card-h"><h2>季度 EPS</h2><span class="muted small">單季，元</span></div><div class="chart sm" id="ec"></div></div></section>
    <section class="card"><div class="card-h"><h2>季度財報摘要</h2><span class="muted small">ROE ${fmt("roe", s.roe)}・ROA ${fmt("roa", s.roa)}・負債比 ${fmt("debt_ratio", s.debt_ratio)}・F-Score ${s.fscore != null ? s.fscore + "/9" : s.fscore_n != null ? `資料不足（${s.fscore_n}/9 項可算）` : "—"}・資料完整度 ${s.data_completeness ?? "—"}%${s.eps_q_turn ? "・單季 EPS " + esc(s.eps_q_turn) : ""}</span></div><div class="tbl">${finTable(d.financials)}</div></section>
    <section class="two">
      <div class="card"><div class="card-h"><h2>三大法人買賣超</h2><span class="muted small">每日合計，張</span></div><div class="chart sm" id="ic"></div>
        <div class="muted small" style="margin-top:6px">外資 5 日 ${fmt("foreign_5d", s.foreign_5d)}・投信 5 日 ${fmt("trust_5d", s.trust_5d)}・外資連買 ${s.foreign_streak ?? "—"} 日・投信連買 ${s.trust_streak ?? "—"} 日・融資 20 日 ${fmt("margin_chg_20d", s.margin_chg_20d)}</div></div>
      <div class="card"><div class="card-h"><h2>本益比走勢</h2><span class="muted small">一年位階 ${s.per_pctile_1y == null ? "—" : fmtNum(s.per_pctile_1y, 0) + "%"}</span></div><div class="chart sm" id="vc"></div></div></section>
    <section class="two">
      <div class="card"><div class="card-h"><h2>技術面參考</h2></div><div class="stats">
        ${[["rsi", "RSI(14)"], ["k", "K 值"], ["macd_hist", "MACD 柱"], ["vol_ratio", "量比"], ["dist_ma60", "季線乖離"], ["stop_ref", "參考停損價"]].map(([k, l]) => `<div class="stat"><span>${l}</span><b>${k === "stop_ref" ? fmtNum(s[k]) : fmt(k, s[k])}</b></div>`).join("")}</div>
        <p class="muted small" style="margin:8px 0 0">參考停損價 = MA20 與近 10 日最低價取低者，僅供風險控管參考。</p></div>
      <div class="card"><div class="card-h"><h2>股利紀錄</h2><span class="muted small">連續配息 ${s.div_years ?? "—"} 年・發放率 ${fmt("payout", s.payout)}</span></div>
        <div class="tbl"><table><thead><tr><th>年度</th><th class="r">現金股利</th><th class="r">股票股利</th></tr></thead><tbody>
        ${(d.dividends || []).slice(-8).reverse().map((x) => `<tr><td class="num">${x.year}</td><td class="r num">${fmtNum(x.cash)}</td><td class="r num">${fmtNum(x.stock)}</td></tr>`).join("") || '<tr><td colspan="3" class="empty">無資料</td></tr>'}</tbody></table></div></div></section>
    <section class="two">
      <div class="card"><div class="card-h"><h2>策略範本檢查</h2><span class="muted small">符合 ${s.strategies.length} / ${SNAP.strategies.length}</span></div>
        ${SNAP.strategies.map((st) => { const ok = s.strategies.includes(st.id); return `<details class="strat"${ok ? " open" : ""}><summary>${ok ? '<span class="pill good">符合</span>' : '<span class="pill">未符合</span>'} ${esc(st.name)}</summary>
          ${st.conditions.map((c) => `<div class="ck">${mark(check(c, s))}<span>${esc(c.label)}</span><span class="num muted">${CAT[c.m] ? fmt(c.m, s[c.m]) : ""}</span></div>`).join("")}</details>`; }).join("")}</div>
      <div class="card"><div class="card-h"><h2>近期新聞</h2><span class="muted small">標題關鍵字判讀，僅供參考</span></div>
        <ul class="news">${(d.news || []).map((n) => { const t = tone(n.title); return `<li><span class="num faint">${esc(n.date)}</span><span>${t ? `<span class="pill ${t > 0 ? "good" : "bad"}">${t > 0 ? "偏多" : "偏空"}</span> ` : ""}${n.link ? `<a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a>` : esc(n.title)} <span class="faint">${esc(n.source || "")}</span></span></li>`; }).join("") || '<li class="muted">沒有近期新聞</li>'}</ul></div></section>`;
  const drawSpec = (k) => { $("#spec").innerHTML = specHtml(k, s); };
  drawSpec(mode);
  const drawBd = (md) => { $("#bd").innerHTML = breakdown(s, md); };
  drawBd(mode);
  $("#bdSeg").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; $$("#bdSeg button").forEach((x) => x.classList.toggle("on", x === b)); drawBd(b.dataset.m); };
  $("#specSeg").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; store.set("aimode", b.dataset.m); $$("#specSeg button").forEach((x) => x.classList.toggle("on", x === b)); drawSpec(b.dataset.m); };
  drawPrice(d.prices);
  $("#rng").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; store.set("rng", b.dataset.r); $$("#rng button").forEach((x) => x.classList.toggle("on", x === b)); drawPrice(d.prices); };
  $("#typ").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; store.set("typ", b.dataset.t); $$("#typ button").forEach((x) => x.classList.toggle("on", x === b)); drawPrice(d.prices); };
  $$("[data-ma]").forEach((x) => x.onchange = () => { store.set("ma", $$("[data-ma]:checked").map((y) => +y.dataset.ma)); drawPrice(d.prices); });
  drawSmall(d);
}
function drawPrice(px) {
  if (!hasLWC()) { $("#pc").innerHTML = '<div class="empty">圖表元件無法載入（需要連網）</div>'; return; }
  if (priceChart) { priceChart.remove(); charts = charts.filter((c) => c !== priceChart); }
  const days = { "1M": 22, "3M": 66, "6M": 130, "1Y": 252, "2Y": 520 }[store.get("rng", "6M")];
  const typ = store.get("typ", "candle"), mas = store.get("ma", [20, 60]);
  const c = priceChart = mkChart($("#pc")), up = css("--up"), dn = css("--down"), view = px.slice(-days), from = view[0]?.date;
  if (typ === "candle") c.addCandlestickSeries({ upColor: up, downColor: dn, borderUpColor: up, borderDownColor: dn, wickUpColor: up, wickDownColor: dn }).setData(view.map((p) => ({ time: p.date, open: p.open, high: p.high, low: p.low, close: p.close })));
  else c.addAreaSeries({ lineColor: css("--accent-2"), topColor: css("--accent-soft"), bottomColor: "transparent", lineWidth: 2 }).setData(view.map((p) => ({ time: p.date, value: p.close })));
  mas.forEach((n) => c.addLineSeries({ color: css(`--ma${n}`), lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }).setData(maSeries(px, n).filter((x) => x.time >= from)));
  const v = c.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "v", lastValueVisible: false, priceLineVisible: false });
  c.priceScale("v").applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  v.setData(view.map((p) => ({ time: p.date, value: p.volume / 1000, color: (p.close >= p.open ? up : dn) + "55" })));
  c.priceScale("right").applyOptions({ scaleMargins: { top: 0.06, bottom: 0.22 } });
  c.timeScale().fitContent();
}
function finTable(f) {
  if (!f?.length) return '<div class="empty">無財報資料</div>';
  const pct = (a, b) => a != null && b ? fmtNum(a / b * 100, 1) + "%" : "—";
  return `<table><thead><tr><th>期間</th><th class="r">營收</th><th class="r">毛利率</th><th class="r">營益率</th><th class="r">淨利</th><th class="r">EPS</th><th class="r">營業現金流</th><th class="r">負債比</th></tr></thead><tbody>
    ${f.slice(-8).reverse().map((x) => `<tr><td class="num">${x.period}</td><td class="r num">${money(x.revenue)}</td><td class="r num">${pct(x.gross_profit, x.revenue)}</td><td class="r num">${pct(x.operating_income, x.revenue)}</td>
      <td class="r num">${money(x.net_income)}</td><td class="r num">${fmtNum(x.eps)}</td><td class="r num">${money(x.ocf)}</td><td class="r num">${pct(x.total_liabilities, x.total_assets)}</td></tr>`).join("")}</tbody></table>`;
}
function drawSmall(d) {
  if (!hasLWC()) return;
  const up = css("--up"), dn = css("--down"), acc = css("--accent-2"), rv = d.revenue || [];
  if (rv.length) {
    const c = mkChart($("#rc"), { leftPriceScale: { visible: true, borderVisible: false } }), map = Object.fromEntries(rv.map((x) => [x.ym, x.revenue])), last = rv.slice(-24);
    c.addHistogramSeries({ color: acc + "88", priceFormat: { type: "price", precision: 1, minMove: 0.1 } }).setData(last.map((x) => ({ time: x.ym + "-01", value: x.revenue / 1e8 })));
    c.addLineSeries({ color: up, lineWidth: 2, priceScaleId: "left", priceLineVisible: false }).setData(last.map((x) => { const [y, m] = x.ym.split("-"), p = map[`${+y - 1}-${m}`]; return p ? { time: x.ym + "-01", value: (x.revenue / p - 1) * 100 } : null; }).filter(Boolean));
    c.timeScale().fitContent();
  } else $("#rc").innerHTML = '<div class="empty">無月營收資料</div>';
  const f = (d.financials || []).filter((x) => x.eps != null);
  if (f.length) { const c = mkChart($("#ec")); c.addHistogramSeries({ priceLineVisible: false }).setData(f.map((x) => ({ time: x.period_end, value: x.eps, color: x.eps >= 0 ? up : dn }))); c.timeScale().fitContent(); }
  else $("#ec").innerHTML = '<div class="empty">無 EPS 資料</div>';
  const inst = d.institutional || [];
  if (inst.length) { const c = mkChart($("#ic")); c.addHistogramSeries({ priceLineVisible: false }).setData(inst.map((x) => { const t = (x.foreign_net + x.trust_net + x.dealer_net) / 1000; return { time: x.date, value: t, color: t >= 0 ? up : dn }; })); c.timeScale().fitContent(); }
  else $("#ic").innerHTML = '<div class="empty">無法人資料</div>';
  const val = (d.valuation || []).filter((x) => x.per > 0);
  if (val.length) { const c = mkChart($("#vc")); c.addLineSeries({ color: acc, lineWidth: 2, priceLineVisible: false }).setData(val.map((x) => ({ time: x.date, value: x.per }))); c.timeScale().fitContent(); }
  else $("#vc").innerHTML = '<div class="empty">無本益比資料（虧損或無資料）</div>';
}

// ---------- 路由 ----------
function route() {
  charts.forEach((c) => { try { c.remove(); } catch (e) {} }); charts = []; priceChart = null;
  const [p, arg] = location.hash.replace(/^#\/?/, "").split("/");
  $$("#nav a").forEach((a) => a.classList.toggle("on", a.dataset.r === (p === "stock" ? "__" : p === "s" ? "radar" : p || "")));
  ({ buy: pageBuy, radar: pageRadar, s: () => pageStrategy(arg), ai: pageAI, screener: pageScreener, watch: pageWatch, catalog: pageCatalog, trust: pageTrust, stock: () => pageStock(arg) }[p] || pageHome)();
  window.scrollTo(0, 0);
}
$("#q").addEventListener("change", (e) => { const id = e.target.value.trim().split(/\s+/)[0]; if (BYID[id]) { location.hash = `#/stock/${id}`; e.target.value = ""; } });
$("#q").addEventListener("keydown", (e) => { if (e.key !== "Enter") return; const q = e.target.value.trim(), hit = BYID[q.split(/\s+/)[0]] || SNAP.stocks.find((s) => s.name.includes(q)); if (hit) { location.hash = `#/stock/${hit.stock_id}`; e.target.value = ""; } });
window.addEventListener("hashchange", route);
loadSnap().then((ok) => ok && route());
</script>
</body>
</html>
