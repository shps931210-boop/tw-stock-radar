# 部署「問 AI 這檔股票」的後端（Cloudflare Worker）。
# 需要先在 Settings → Secrets and variables → Actions 新增三個 secret：
#   ANTHROPIC_API_KEY（Anthropic Console 建立）、CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（Cloudflare 建立）
# 金鑰只會存到 Cloudflare，網站和 repository 裡都看不到。設定好後在 Actions 頁面按「Run workflow」。
name: 部署 AI 問答

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/chat.yml"]

permissions:
  contents: write              # 把 Worker 網址寫進 chat.json
  actions: write               # 部署完觸發「盤後更新」重建網站

concurrency:
  group: chat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.ANTHROPIC_API_KEY != '' && secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: 測試
        run: npm test
      - name: 還沒設定金鑰就跳過
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::還沒設定 ANTHROPIC_API_KEY、CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID，先不部署。"
      - name: 部署到 Cloudflare
        id: deploy
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npx wrangler deploy | tee deploy.log
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::找不到 Worker 網址。請先到 Cloudflare 的 Workers & Pages 頁面開啟一次，建立 workers.dev 子網域。"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 把網址寫進網站設定並重建網站
        if: steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        working-directory: .
        run: |
          printf '{"url": "%s"}\n' "$URL" > chat.json
          if [ -n "$(git status --porcelain chat.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add chat.json && git commit -q -m "AI 問答網址"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          gh workflow run update.yml --ref main
