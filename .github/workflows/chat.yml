# 部署「AI 研究助理」的後端（Cloudflare Worker）：全站 AI 研究助理與個股頁的問答都用它。部署後會真的問三題做實際測試。
# 需要先在 Settings → Secrets and variables → Actions 新增兩個 secret：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（Cloudflare 建立）
#   只有這兩個：使用 Cloudflare Workers AI 免費模型（每天有免費額度）。
#   另外加上 ANTHROPIC_API_KEY（Anthropic Console 建立，要儲值）：改用 Claude，回答品質較好。
# 以及會員系統的 variables：SUPABASE_URL、SUPABASE_KEY（AI 問答只開放給登入會員，每人每天有上限）
# 金鑰只會存到 Cloudflare，網站和 repository 裡都看不到。設定好後在 Actions 頁面按「Run workflow」。
name: 部署 AI 研究助理

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/chat.yml"]

permissions:
  contents: write              # 把 Worker 網址寫進 chat.json
  actions: write               # 部署完觸發「盤後更新」重建網站

concurrency:
  group: chat
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && vars.SUPABASE_URL != '' && vars.SUPABASE_KEY != '' }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: 測試
        run: npm test
      - name: 還沒設定金鑰就跳過
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice::還沒設定 CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（secrets）或 SUPABASE_URL、SUPABASE_KEY（variables），先不部署。"
      - name: 部署到 Cloudflare
        id: deploy
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          npx wrangler deploy --var "SUPABASE_URL:$SUPABASE_URL" --var "SUPABASE_KEY:$SUPABASE_KEY" | tee deploy.log
          # 實際測試用的通行碼：每次部署隨機產生，只有這次流程知道
          token=$(openssl rand -hex 24); echo "::add-mask::$token"
          printf '%s' "$token" | npx wrangler secret put SMOKE_TOKEN
          echo "token=$token" >> "$GITHUB_OUTPUT"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
            echo "::notice::使用 Claude（ANTHROPIC_API_KEY 已設定）"
          else
            npx wrangler secret delete ANTHROPIC_API_KEY --force >/dev/null 2>&1 || true
            echo "::notice::沒有 ANTHROPIC_API_KEY，使用 Cloudflare Workers AI 免費模型"
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then echo "::error::找不到 Worker 網址。請先到 Cloudflare 的 Workers & Pages 頁面開啟一次，建立 workers.dev 子網域。"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: 實際問答測試（問剛部署好的 AI 四題，結果在這次執行的摘要）
        if: steps.deploy.outputs.url
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          SMOKE_TOKEN: ${{ steps.deploy.outputs.token }}
        run: |
          sleep 15
          node smoke.mjs | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - name: 把網址寫進網站設定並重建網站
        if: steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PROVIDER: ${{ secrets.ANTHROPIC_API_KEY != '' && 'claude' || 'free' }}
        working-directory: .
        run: |
          printf '{"url": "%s", "provider": "%s"}\n' "$URL" "$PROVIDER" > chat.json
          if [ -n "$(git status --porcelain chat.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add chat.json && git commit -q -m "AI 研究助理網址"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
          gh workflow run update.yml --ref main
