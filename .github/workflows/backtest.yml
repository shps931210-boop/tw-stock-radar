# AI 多因子歷史回測（只用當時已公布的資料重建每個月的 AI 排名）。
# 每週六早上跑一次（需要約 40～60 分鐘），結果存到 history/backtest/ai_pit.json 與 factors.json（因子有效性檢驗），下一次盤後更新時發布到網站。
# 也可以在 Actions 頁面按「Run workflow」手動執行。
name: AI 歷史回測

on:
  schedule:
    - cron: "0 1 * * 6"        # 台灣時間週六 09:00
  workflow_dispatch:

permissions:
  contents: write              # 把回測結果 commit 回 repository

concurrency:
  group: backtest
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 下載最新的資料庫備份
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          gh release download db-backup -p stocks.db.gz -D data && gunzip -f data/stocks.db.gz
          python -c "import sqlite3; print('股價筆數', sqlite3.connect('data/stocks.db').execute('SELECT COUNT(*) FROM prices').fetchone()[0])"
      - name: 執行回測
        run: python -m app.pit_backtest
      - name: AI 量化選股＋進出場聯合回測
        run: python -m app.joint_backtest
      - name: 因子有效性檢驗
        run: python -m app.factor_research
      # 風險規則逐項檢驗（過熱、高波動、產業集中、市場狀態、0050 基準部位）：只做研究，不改正式模型
      - name: 風險規則逐項檢驗
        id: risk
        continue-on-error: true
        run: python -m app.risk_research
      # V28 資料與回測稽核（有沒有偷看到未來資料）：只報告，不擋後面的研究
      - name: 資料與回測稽核
        id: leak
        continue-on-error: true
        run: python -m app.leak_audit
      # V27 推薦組合風險研究（原始／流動性限制／產業限制／聯合限制 Top10）：只做研究，原始排名不變
      - name: 推薦組合風險研究
        id: port
        continue-on-error: true
        run: python -m app.portfolio_research
      # V22 預測模型研究（影子模式，不影響正式排行榜）：V21 固定權重 vs Ridge／Logistic／LightGBM
      - name: 預測模型研究
        id: mlr
        continue-on-error: true
        env:
          ML_PANEL_CACHE: "1"        # V31：研究資料集存成 data/ml_panel.pkl，給每天的自主學習補標籤、重新訓練候選模型
        run: |
          pip install lightgbm==4.5.0
          python -m app.ml_research
      - name: 上傳研究資料集（每日自主學習用）
        id: panel
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/ml_panel.pkl ] || { echo "沒有研究資料集"; exit 0; }
          gzip -c data/ml_panel.pkl > ml_panel.pkl.gz
          gh release view ml-panel >/dev/null 2>&1 || gh release create ml-panel --prerelease --title "AI 研究資料集" --notes "每週 AI 歷史回測產生的特徵與標籤（只有公開市場資料），每天的自主學習會補上新到期的標籤。"
          gh release upload ml-panel ml_panel.pkl.gz --clobber
      # V13 LightGBM 專項研究（只做研究）：預測目標、訓練視窗、模型融合；事前固定 7 個比較，結果寫 history/backtest/lgbm_study.json
      - name: LightGBM 專項研究
        id: lgbm
        continue-on-error: true
        timeout-minutes: 150
        run: |
          # V15 研究代理把關：同一研究連續 2 次全部沒通過、新資料又不夠，就不重跑（避免反覆跑已失敗的實驗）
          if python -m app.evolution allowed lgbm_study; then python -m app.lgbm_study data/ml_panel.pkl; fi
      # V14 投資組合研究：同一份 LightGBM 排序換 14 種選股與持股方式（用上一步存下的預測，不重新訓練）
      - name: 投資組合轉化研究
        id: pst
        continue-on-error: true
        timeout-minutes: 30
        run: python -m app.portfolio_study
      # V21 選股品質總檢討（2026-10-28 事前登記）：高分股驗證、輸 0050 的拆解、五大因子、積極型候選規則；只做研究
      - name: 選股品質總檢討
        id: sel
        continue-on-error: true
        timeout-minutes: 60
        run: python -m app.selection_study
      # V21.1 學術假說的台股驗證（2026-10-28 事前登記）：用上一步存下的同一份樣本，不重算分數
      - name: 學術假說驗證
        id: acad
        continue-on-error: true
        timeout-minutes: 60
        run: python -m app.academic_study
      # V21.2 投資價值 × 進場機會兩層分數研究（2026-10-28 事前登記）：用上一步的特徵快取
      - name: 兩層分數研究
        id: twol
        continue-on-error: true
        timeout-minutes: 30
        run: python -m app.twolayer_study
      # V21.2（2026-10-29 事前登記 docs/prereg_v21_2.md）：五大因子檢查、MSURGE 組合 A～F、進場方法 A/B/C、失準歸因
      - name: V21.2 因子與進場研究
        id: v212
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python -m app.factor_audit
          python -m app.msurge_study
          python -m app.entry_study
          python -m app.miss_review
      # 學術證據庫 DOI 核對（Crossref 免費 API）
      - name: 文獻 DOI 核對
        id: doi
        continue-on-error: true
        timeout-minutes: 10
        run: python -m app.literature
      # V15 實驗記憶：把這次每個研究變體登記到 history/research/experiments.json（已登記的不重複）
      - name: 登記實驗
        id: ingest
        continue-on-error: true
        run: python -m app.evolution ingest
      # V20：只做研究、失敗不擋後面步驟的項目，每次結果都記錄（history/audit/steps_backtest.json）；同一步驟連續失敗 2 次，下一次盤後檢查會寄信
      - name: 記錄研究步驟的結果
        if: always()
        continue-on-error: true
        env:
          STEP_LOG: history/audit/steps_backtest.json
        run: >-
          python -m app.step_log "風險規則檢驗=${{ steps.risk.outcome }}" "資料與回測稽核=${{ steps.leak.outcome }}"
          "組合風險研究=${{ steps.port.outcome }}" "預測模型研究=${{ steps.mlr.outcome }}" "上傳研究資料集=${{ steps.panel.outcome }}"
          "LightGBM 研究=${{ steps.lgbm.outcome }}" "投資組合研究=${{ steps.pst.outcome }}" "登記實驗=${{ steps.ingest.outcome }}" "選股品質總檢討=${{ steps.sel.outcome }}" "學術假說驗證=${{ steps.acad.outcome }}" "文獻核對=${{ steps.doi.outcome }}" "兩層分數研究=${{ steps.twol.outcome }}" "V21.2 因子與進場研究=${{ steps.v212.outcome }}"
      - name: 保存結果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/backtest/ history/models/ history/research/ history/audit/steps_backtest.json
          if git diff --cached --quiet; then echo "結果沒有變化"; exit 0; fi
          git commit -q -m "AI 歷史回測 $(date +%F)"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
