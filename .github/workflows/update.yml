# 每個交易日盤後自動抓官方資料、重算選股，發布到 GitHub Pages。
# 使用前：Settings → Pages → Source 選 GitHub Actions；
#         Settings → Secrets and variables → Actions 新增 FINMIND_TOKEN（財報、股利用，可不填但額度較低）。
# GitHub 的排程可能延遲或偶爾被略過，所以排了多個時段；程式只補缺少的資料，重複執行沒有副作用。
# 也可以在 Actions 頁面按「Run workflow」手動更新。
# 兩種模式：
#   快速（14:10、14:40、16:30）：只抓最近幾天的收盤行情與籌碼，重算一次就發布，不等歷史回補與財報。
#   完整（21:00）：再加上歷史股價回補、財報、股利與連線診斷。今天的行情不會因為舊資料還沒補完而延後。
#   夜間財報補齊（22:30～06:30 每小時，每天）：只補財報、月營收、股利。FinMind 免費額度是「每小時」計算，
#     分成多次補抓才能較快補完全市場；會員申請優先補抓的股票最先處理。不碰行情，不會改變當天的收盤資料。
name: 盤後更新

on:
  schedule:                    # 時間是 UTC，以下換算成台灣時間
    - cron: "10 6 * * 1-5"     # 14:10 快速：收盤行情（證交所通常 14:00 後陸續公布）
    - cron: "40 6 * * 1-5"     # 14:40 快速：補上較晚公布的櫃買與法人資料
    - cron: "30 8 * * 1-5"     # 16:30 快速：補跑（萬一前一次延遲或失敗）
    - cron: "0 13 * * 1-5"     # 21:00 完整：融資等最晚公布的資料＋歷史回補、財報、股利
    - cron: "30 14-22 * * *"   # 22:30～06:30 每小時：夜間財報補齊
    - cron: "20 22 * * 0-4"    # 交易日 06:20 盤前：隔夜美股、匯率、收盤後公告
    - cron: "15 0 * * 1-5"     # 交易日 08:15 盤前：再收集一次並封存「盤前版」（08:40 前發布）
    - cron: "30 3 * * 1-5"     # 交易日 11:30：盤前版封存後的新重大事件警示
    - cron: "0 2 * * 6"        # 週六 10:00：週末事件收集（美股週五結果、週五盤後公告）
    - cron: "0 12 * * 0"       # 週日 20:00：週末事件收集
  workflow_dispatch:
    inputs:
      mode:
        description: "fast＝快速收盤更新；full＝完整更新（含歷史回補、財報）；backfill＝夜間補齊（長期歷史股價＋財報）"
        default: fast
        type: choice
        options: [fast, full, backfill, premarket]

permissions:
  contents: write              # 把每日選股紀錄 commit 回 repository
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Asia/Taipei
  # 21:00 的排程與手動選 full 跑完整更新，其他都是快速更新
  # 盤前（premarket）：不抓行情，只收集隔夜市場與事件、產生盤前情報（app/premarket.py）
  MODE: ${{ (github.event.schedule == '0 13 * * 1-5' || inputs.mode == 'full') && 'full' || (github.event.schedule == '30 14-22 * * *' || inputs.mode == 'backfill') && 'backfill' || (contains(fromJSON('["20 22 * * 0-4","15 0 * * 1-5","30 3 * * 1-5","0 2 * * 6","0 12 * * 0"]'), github.event.schedule) || inputs.mode == 'premarket') && 'premarket' || 'fast' }}
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}   # 會員登入（公開值，放在 repository variables）
  SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}

jobs:
  # 完整測試和資料更新同時跑（不再排在更新前面）；測試沒過就不部署
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 自動測試（資料對齊、完整性、備援同步；失敗就不更新網站）
        run: python -m unittest discover tests

  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      site: ${{ steps.build.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: echo "這次是 ${MODE} 更新" >> "$GITHUB_STEP_SUMMARY"

      # 資料庫存在 Actions 快取（7 天沒用到或容量滿會被清掉，屆時自動重新回補）。
      # 長期使用建議改存到持久化儲存，見 README。
      - uses: actions/cache/restore@v4
        with:
          path: data/stocks.db
          key: stocks-db-${{ github.run_id }}
          restore-keys: stocks-db-

      # 快取被 GitHub 清掉時（7 天沒用或容量滿），改從 Release 裡的備份還原，不必重新回補一年資料
      - name: 快取不見時，從備份還原資料庫
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 快取裡的資料庫太小或讀不到股價（例如之前失敗的執行存了空檔），當作沒有快取，改用備份
          if [ -f data/stocks.db ] && ! python -c "import sqlite3,sys; n=sqlite3.connect('data/stocks.db').execute('SELECT COUNT(*) FROM prices').fetchone()[0]; print('快取資料庫股價筆數', n); sys.exit(0 if n >= 100000 else 1)"; then
            echo "快取的資料庫不完整，改從備份還原"; rm -f data/stocks.db
          fi
          if [ ! -f data/stocks.db ]; then
            gh release download db-backup -p stocks.db.gz -D data && gunzip -f data/stocks.db.gz && echo "已從備份還原資料庫" || echo "沒有備份，從頭回補"
          fi

      # 連線診斷只用來查問題，失敗不影響更新；資料是否可用由後面的「檢查資料是否最新」把關
      - name: 連線診斷（結果發布在網站的 data/probe.json；只在完整更新時跑）
        if: env.MODE == 'full'
        continue-on-error: true
        run: python -m app.probe

      - name: 更新資料（快速：最近幾天；完整：再回補歷史、財報）
        id: update
        if: env.MODE != 'premarket'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}   # 只用來讀「優先補抓財報」的申請，不會進網站
        run: python -m app.update $([ "$MODE" = fast ] && echo --fast) $([ "$MODE" = backfill ] && echo --backfill)

      # 盤前模式不抓行情：用資料庫重建選股快照（盤前情報要知道盤後名單），網站照常發布
      - name: 重建選股快照（盤前模式）
        if: env.MODE == 'premarket'
        run: python -c "from app import snapshot; snapshot.build()"

      # 每日影子預測（V23）：套用每週訓練好的模型，封存到 history/predictions/；失敗不影響網站
      # V27：快速盤後更新也會跑；當天上市、上櫃行情都齊全才封存（不齊就等下一次），同一天只封存一次
      - name: 每日影子預測
        if: env.MODE != 'premarket'
        continue-on-error: true
        run: |
          pip install -q lightgbm==4.5.0
          python -m app.ml_predict

      # 新聞與公告失敗不影響股價更新；網站新聞中心會顯示最後成功時間與警告
      - name: 新聞與公司公告
        if: env.MODE != 'backfill'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m app.news

      - name: 國際市場（美股、費城半導體、匯率）
        if: env.MODE != 'backfill'
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m app.global_mkt

      - name: AI 盤前情報（隔夜市場、收盤後事件、盤前版風險標示）
        if: env.MODE == 'premarket'
        continue-on-error: true
        timeout-minutes: 10
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m app.premarket

      - name: 盤前情報對帳（盤後版／盤前版的實際結果）
        if: env.MODE == 'full'
        continue-on-error: true
        run: python -m app.premarket --score

      - name: 備份資料庫到 GitHub Release
        id: backup
        if: env.MODE != 'premarket'
        continue-on-error: true      # 備份失敗不影響網站更新，但會記錄下來，最後一步讓這次執行標成失敗並寄信
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import sqlite3,sys; c=sqlite3.connect('data/stocks.db'); r=c.execute('PRAGMA integrity_check').fetchone()[0]; n=c.execute('SELECT COUNT(*) FROM prices').fetchone()[0]; print('integrity', r, 'prices', n); sys.exit(0 if r == 'ok' and n > 0 else 1)"
          gzip -c data/stocks.db > stocks.db.gz
          gh release view db-backup >/dev/null 2>&1 || gh release create db-backup --prerelease --title "資料庫備份" --notes "每次更新成功後自動上傳的 SQLite 資料庫（只有公開市場資料），Actions 快取被清除時用來還原。"
          gh release upload db-backup stocks.db.gz --clobber

      # 還原測試：把剛上傳的備份下載回來解壓縮，做完整性檢查並比對筆數、最新日期，確定真的還原得回來
      - name: 備份還原測試
        id: restore
        if: steps.backup.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/rt" && mkdir -p "$RUNNER_TEMP/rt"
          gh release download db-backup -p stocks.db.gz -D "$RUNNER_TEMP/rt"
          python -m app.backup verify "$RUNNER_TEMP/rt/stocks.db.gz"

      - name: 記錄備份狀態（網站可信度頁會顯示）
        if: always() && env.MODE != 'premarket'
        run: python -m app.backup status "${{ steps.backup.outcome }}" "${{ steps.restore.outcome }}"

      # 只有資料更新成功才存快取，避免把失敗或不完整的資料庫存成下一次的起點
      - uses: actions/cache/save@v4
        if: always() && (steps.update.outcome == 'success' || env.MODE == 'premarket')
        with:
          path: data/stocks.db
          key: stocks-db-${{ github.run_id }}

      # 沒有任何真實資料就不發布，網站維持上一次成功的版本
      - id: build
        run: python build_site.py --strict && echo "site=ok" >> "$GITHUB_OUTPUT"
      # 每日選股紀錄存進 repository（history/picks/），不會因為快取被清掉而遺失；
      # 每個交易日都有 commit，也讓 repository 保持活躍，排程不會因 60 天沒有活動而被 GitHub 暫停
      - name: 保存每日選股紀錄
        if: always() && steps.build.outputs.site == 'ok'
        run: |
          if [ -n "$(git status --porcelain history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history
            git commit -q -m "每日選股紀錄 $(ls history/picks | tail -1 | sed 's/.json//')"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      # 會員通知：依每位會員的觀察清單產生通知（會員沒打開網站也會收到）。
      # 需要 Secret SUPABASE_SECRET_KEY（Supabase 的 sb_secret_ 金鑰），只在這一步使用，不會進網站；沒設定就跳過。
      - name: 產生會員通知
        if: always() && steps.build.outputs.site == 'ok'
        continue-on-error: true
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -m app.alerts site/data/alerts/engine.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 資料過期、來源失敗或備份失敗時讓這次執行標成失敗，GitHub 會寄通知信；網站仍會發布並在頂端顯示警告
      - name: 檢查資料是否最新、備份是否成功
        if: env.MODE != 'premarket'
        run: python -m app.check

  deploy:
    needs: [test, update]
    if: always() && needs.test.result == 'success' && needs.update.outputs.site == 'ok'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
