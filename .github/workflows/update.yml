# 每個交易日盤後自動抓官方資料、重算選股，發布到 GitHub Pages。
# 使用前：Settings → Pages → Source 選 GitHub Actions；
#         Settings → Secrets and variables → Actions 新增 FINMIND_TOKEN（財報、股利用，可不填但額度較低）。
# GitHub 的排程可能延遲或偶爾被略過，所以排了多個時段；程式只補缺少的資料，重複執行沒有副作用。
# 也可以在 Actions 頁面按「Run workflow」手動更新。
name: 盤後更新

on:
  schedule:                    # 時間是 UTC，以下換算成台灣時間
    - cron: "40 6 * * 1-5"     # 14:40 收盤行情
    - cron: "30 8 * * 1-5"     # 16:30 補跑（萬一前一次延遲或失敗）
    - cron: "0 13 * * 1-5"     # 21:00 法人、融資等較晚公布的資料
  workflow_dispatch:

permissions:
  contents: write              # 把每日選股紀錄 commit 回 repository
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

env:
  TZ: Asia/Taipei

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      site: ${{ steps.build.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 自動測試（資料對齊、完整性、備援同步；失敗就不更新網站）
        run: python -m unittest discover tests

      # 資料庫存在 Actions 快取（7 天沒用到或容量滿會被清掉，屆時自動重新回補）。
      # 長期使用建議改存到持久化儲存，見 README。
      - uses: actions/cache/restore@v4
        with:
          path: data/stocks.db
          key: stocks-db-${{ github.run_id }}
          restore-keys: stocks-db-

      - name: 連線診斷（結果發布在網站的 data/probe.json）
        continue-on-error: true
        run: python -m app.probe

      - name: 更新資料（先抓最新收盤價，再回補歷史）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python -m app.update

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/stocks.db
          key: stocks-db-${{ github.run_id }}

      # 沒有任何真實資料就不發布，網站維持上一次成功的版本
      - id: build
        run: python build_site.py --strict && echo "site=ok" >> "$GITHUB_OUTPUT"
      # 每日選股紀錄存進 repository（history/picks/），不會因為快取被清掉而遺失；
      # 每個交易日都有 commit，也讓 repository 保持活躍，排程不會因 60 天沒有活動而被 GitHub 暫停
      - name: 保存每日選股紀錄
        if: always() && steps.build.outputs.site == 'ok'
        run: |
          if [ -n "$(git status --porcelain history)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history
            git commit -q -m "每日選股紀錄 $(ls history/picks | tail -1 | sed 's/.json//')"
            for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 資料過期或來源失敗時讓這次執行標成失敗，GitHub 會寄通知信；網站仍會發布並在頂端顯示警告
      - name: 檢查資料是否最新
        run: python -m app.check

  deploy:
    needs: update
    if: always() && needs.update.outputs.site == 'ok'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
