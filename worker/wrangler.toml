# 股栗子 AI 研究助理（Cloudflare Worker）。由 GitHub Actions「部署 AI 研究助理」自動部署。
# 有 ANTHROPIC_API_KEY（Cloudflare secret，不寫在這裡）就用 Claude；沒有就用下面 [ai] 的 Workers AI 免費模型。
name = "gulizi-chat"
main = "index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE = "https://shps931210-boop.github.io/tw-stock-radar"
ALLOWED_ORIGIN = "https://shps931210-boop.github.io"
MODEL = "claude-opus-5-5"   # 有 Claude 金鑰時用的模型；想省錢可改成 claude-haiku-5-5
FREE_MODEL = "@cf/qwen/qwen3-30b-a3b-fp8"   # 沒有 Claude 金鑰時用的免費模型（Cloudflare 每天 10,000 Neurons 免費額度）

# 額外防護：每個 IP 每分鐘最多 5 個問題。真正的限制是會員登入＋每人／全站每日額度（supabase/schema.sql 的 use_ai_quota）。
# SUPABASE_URL、SUPABASE_KEY 由部署流程從 GitHub repository variables 帶入。總花費上限也請在 Anthropic Console 設定。
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Cloudflare Workers AI（免費額度）
[ai]
binding = "AI"
